name: Physics regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  thin-film-v092:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check assets/js/thin-film-v08-physics.js
          node --check assets/js/thin-film-v08-patch.js
          node --check assets/js/thin-film-v08-ui.js
          node --check assets/js/model-page-guide-v09.js
          node --check assets/js/canvas-hidpi-v092.js
      - name: Thin-film physical invariants
        run: node tests/thin-film-v08-physics.test.js
      - name: Model-page structure contract
        run: node tests/model-page-guide-v09.test.js
      - name: High-DPI canvas and plot overlay contract
        run: node tests/canvas-hidpi-v092.test.js
