name: Physics regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  thin-film-v08:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check assets/js/thin-film-v08-physics.js
          node --check assets/js/thin-film-v08-patch.js
          node --check assets/js/thin-film-v08-ui.js
      - name: Thin-film physical invariants
        run: node tests/thin-film-v08-physics.test.js
