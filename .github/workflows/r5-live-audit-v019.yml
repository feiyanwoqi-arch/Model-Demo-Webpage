name: R5 live visual evidence

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/js/r5-*.js'
      - 'assets/css/r5-*.css'
      - 'tests/r5-*.js'
      - 'tests/visual-audit-r5-*.mjs'
      - '.github/workflows/r5-live-audit-v019.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r5-live-visual-evidence-main
  cancel-in-progress: true

jobs:
  audit-r5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and physics
        run: |
          node --check assets/js/r5-workbench-v019.js
          node --check assets/js/r5-canvas-fit-v019.js
          node --check assets/js/r5-font-floor-v0194.js
          node --check assets/js/r5-canvas-typography-v019.js
          node tests/r5-physics-v019.test.js
          node tests/r5-physics-extended-v019.test.js
          node --check tests/visual-audit-r5-v019.mjs
          node --check tests/visual-audit-r5-occlusion-v019.mjs
          node --check tests/visual-audit-r5-strict-v019.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/model-demo-webpage.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/model-demo-webpage.log
          exit 1
      - name: Run R5 task and typography audit
        id: r5base
        continue-on-error: true
        run: node tests/visual-audit-r5-v019.mjs
      - name: Run R5 containment, drawer and apparatus audit
        id: r5focused
        if: always() && !cancelled()
        continue-on-error: true
        run: node tests/visual-audit-r5-occlusion-v019.mjs
      - name: Run R5 strict v1.3 effective typography audit
        id: r5strict
        if: always() && !cancelled()
        continue-on-error: true
        run: node tests/visual-audit-r5-strict-v019.mjs
      - name: Upload R5 native screenshots
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: r5-live-evidence-v019
          path: |
            visual-audit-r5-v019/
            visual-audit-r5-occlusion-v019/
            visual-audit-r5-strict-v019/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish R5 screenshots and metrics
        if: always() && !cancelled()
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          BASE_OUTCOME: ${{ steps.r5base.outcome }}
          FOCUSED_OUTCOME: ${{ steps.r5focused.outcome }}
          STRICT_OUTCOME: ${{ steps.r5strict.outcome }}
        run: |
          rm -rf /tmp/r5-live-evidence
          mkdir -p /tmp/r5-live-evidence/base /tmp/r5-live-evidence/focused /tmp/r5-live-evidence/strict
          if [ -d visual-audit-r5-v019 ]; then cp -R visual-audit-r5-v019/. /tmp/r5-live-evidence/base/; fi
          if [ -d visual-audit-r5-occlusion-v019 ]; then cp -R visual-audit-r5-occlusion-v019/. /tmp/r5-live-evidence/focused/; fi
          if [ -d visual-audit-r5-strict-v019 ]; then cp -R visual-audit-r5-strict-v019/. /tmp/r5-live-evidence/strict/; fi
          printf '{\n  "source_sha": "%s",\n  "run_id": %s,\n  "base_outcome": "%s",\n  "focused_outcome": "%s",\n  "strict_outcome": "%s"\n}\n' "$SOURCE_SHA" "$RUN_ID" "$BASE_OUTCOME" "$FOCUSED_OUTCOME" "$STRICT_OUTCOME" > /tmp/r5-live-evidence/run.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf docs/live-evidence/r5-v019
            mkdir -p docs/live-evidence/r5-v019
            cp -R /tmp/r5-live-evidence/. docs/live-evidence/r5-v019/
            git add docs/live-evidence/r5-v019
            git commit -m "[r5-live-audit] publish v0.19 screenshots and metrics [skip ci]" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Enforce R5 audit result
        if: ${{ !cancelled() && (steps.r5base.outcome != 'success' || steps.r5focused.outcome != 'success' || steps.r5strict.outcome != 'success') }}
        run: exit 1
