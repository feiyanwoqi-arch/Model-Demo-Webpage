name: Live Pages audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-r2:
    if: ${{ !contains(github.event.head_commit.message || '', '[live-audit-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Audit published R2 v0.16 page
        run: node tests/live-pages-r2-v016.mjs
      - name: Upload live Pages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-r2-v016
          path: live-pages-r2-v016/
          if-no-files-found: error
          retention-days: 14
      - name: Publish durable audit evidence
        if: success()
        run: |
          target="docs/live-evidence/r2-v016"
          mkdir -p "$target"
          cp live-pages-r2-v016/metrics.json "$target/metrics.json"
          cp live-pages-r2-v016/r2-live-1735x865-01-main.png "$target/main.png"
          cp live-pages-r2-v016/r2-live-1735x865-02-mechanism.png "$target/mechanism.png"
          cp live-pages-r2-v016/r2-live-1735x865-03-observable.png "$target/observable.png"
          cp live-pages-r2-v016/r2-live-1735x865-04-parameters.png "$target/parameters.png"
          cat > "$target/README.md" <<'EOF'
          # R2 v0.16 公网验收证据

          本目录由 `Live Pages audit` 在真实 GitHub Pages 公网页面验收成功后自动更新。

          - `metrics.json`：公网资源、布局、实际 Canvas 字号、安全边距、完整模块、拖动和抽屉指标；
          - `main.png`：1735×865 公网主实验台原尺寸截图；
          - `mechanism.png`：公网机制模块原尺寸截图；
          - `observable.png`：公网判据模块原尺寸截图；
          - `parameters.png`：公网参数抽屉原尺寸截图。

          若公网验收失败，本目录不会被更新。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then
            echo "Live evidence unchanged."
          else
            git commit -m "[live-audit-result] record R2 v0.16 public evidence"
            git push
          fi
