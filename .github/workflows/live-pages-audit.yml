name: Live Pages audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live-r2:
    if: ${{ !contains(github.event.head_commit.message || '', '[live-audit-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Audit published R2 v0.18
        run: node tests/live-pages-r2-v018.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-r2-v018
          path: live-pages-r2-v018/
          if-no-files-found: error
          retention-days: 14
      - name: Publish durable evidence
        if: success()
        run: |
          target="docs/live-evidence/r2-v018"
          mkdir -p "$target"
          cp live-pages-r2-v018/metrics.json "$target/metrics.json"
          cp live-pages-r2-v018/wide-compare.png "$target/wide-compare.png"
          cp live-pages-r2-v018/wide-formula.png "$target/wide-formula.png"
          printf '# R2 v0.18 公网验收证据\n\n真实 GitHub Pages 1790×896 左右布局与公式字号验收。\n' > "$target/README.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "[live-audit-result] record R2 v0.18 public evidence" || exit 0
          git push
