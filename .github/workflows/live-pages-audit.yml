name: Live Pages audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-r2:
    if: ${{ !contains(github.event.head_commit.message || '', '[live-audit-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Audit published R2 v0.18 page
        run: node tests/live-pages-r2-v018.mjs
      - name: Upload live Pages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-r2-v018
          path: live-pages-r2-v018/
          if-no-files-found: error
          retention-days: 14
      - name: Publish durable audit evidence
        if: success()
        run: |
          target="docs/live-evidence/r2-v018"
          mkdir -p "$target"
          cp live-pages-r2-v018/metrics.json "$target/metrics.json"
          cp live-pages-r2-v018/r2-live-1790x896-wide-formula.png "$target/wide-formula.png"
          cat > "$target/README.md" <<'EOF'
          # R2 v0.18 公网宽屏与公式验收证据

          本目录由 `Live Pages audit` 在真实 GitHub Pages 公网页面验收成功后自动更新。

          - `metrics.json`：1790×896 公网左右布局、MathJax 实际字号、安全边界与真实拖动指标；
          - `wide-formula.png`：1790×896 公网原尺寸截图。

          若公网验收失败，本目录不会被更新。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then
            echo "Live evidence unchanged."
          else
            git commit -m "[live-audit-result] record R2 v0.18 public evidence"
            git push
          fi
