name: Live Pages audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Audit published R2 page
        run: node tests/live-pages-r2-v015.mjs
      - name: Upload live Pages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-r2-v015
          path: live-pages-r2-v015/
          if-no-files-found: error
          retention-days: 14
