name: Visual audit
on:
  push:
    branches: [main]
    paths-ignore: ['audit/latest-visual-run.json']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optics-workbenches:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: R4 Fresnel physics regression
        run: node tests/r4-fresnel-physics-v019.test.js
      - name: R4 workbench source contract
        run: node tests/r4-workbench-v019.test.js
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/model-demo-webpage.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/model-demo-webpage.log; exit 1
      - name: Thin-film task scenarios
        if: always()
        run: node tests/visual-audit-v012.mjs
      - name: R1 strict runtime visual audit
        if: always()
        run: node tests/visual-audit-r1-v014.mjs
      - name: R2 all actual canvas text audit
        if: always()
        run: node tests/visual-audit-r2-all-canvas-text-v016.mjs
      - name: R2 direct-control audit
        if: always()
        run: node tests/visual-audit-r2-direct-control-v015.mjs
      - name: R2 drawer content-fit audit
        if: always()
        run: node tests/visual-audit-r2-drawer-fit-v015.mjs
      - name: R2 wide synchronized layout and formula audit
        if: always()
        run: node tests/visual-audit-r2-wide-formula-v018.mjs
      - name: R3 finite-ray and legibility audit
        if: always()
        run: node tests/visual-audit-r3-v017.mjs
      - name: R4 Fresnel/Brewster task audit
        if: always()
        run: node tests/visual-audit-r4-v019.mjs
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optics-visual-audit-v019-r4
          path: |
            visual-audit-v012/
            visual-audit-r1-v014/
            visual-audit-r2-all-canvas-text-v016/
            visual-audit-r2-direct-control-v015/
            visual-audit-r2-drawer-fit-v015/
            visual-audit-r2-wide-formula-v018/
            visual-audit-r3-v017/
            visual-audit-r4-v019/
          if-no-files-found: warn
          retention-days: 14
      - name: Record latest direct-main run
        if: always() && github.event_name != 'pull_request'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p audit
          printf '{\n  "run_id": %s,\n  "run_attempt": %s,\n  "source_sha": "%s",\n  "job_status": "%s"\n}\n' "$RUN_ID" "$RUN_ATTEMPT" "$SOURCE_SHA" "$JOB_STATUS" > audit/latest-visual-run.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/latest-visual-run.json
          git commit -m "Record visual audit run $RUN_ID [skip ci]" || exit 0
          git push
