name: Physics regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  optics-workbenches:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check assets/js/thin-film-v08-physics.js
          node --check assets/js/thin-film-v08-patch.js
          node --check assets/js/thin-film-v08-ui.js
          node --check assets/js/model-page-guide-v09.js
          node --check assets/js/canvas-hidpi-v092.js
          node --check assets/js/thin-film-workbench-v010.js
          node --check assets/js/adaptive-edge-rails-v011.js
          node --check assets/js/simultaneous-viewport-v012.js
          node --check assets/js/reflection-foundations-v013-patch.js
          node --check assets/js/reflection-foundations-v013.js
          node --check assets/js/reflection-foundations-v013-sync-patch.js
          node --check assets/js/r3-global-model-bridge-v017.js
          node --check assets/js/r3-label-layout-v017.js
          node --check assets/js/r3-finite-ray-v017.js
          node --check assets/js/r3-runtime-mount-v017.js
          node --check assets/js/r3-direct-drag-v017.js
      - name: Thin-film physical invariants
        run: node tests/thin-film-v08-physics.test.js
      - name: Model-page structure contract
        run: node tests/model-page-guide-v09.test.js
      - name: High-DPI canvas and plot overlay contract
        run: node tests/canvas-hidpi-v092.test.js
      - name: Synchronized workbench contract
        run: node tests/thin-film-workbench-v010.test.js
      - name: Adaptive edge rail contract
        run: node tests/adaptive-edge-rails-v011.test.js
      - name: Simultaneous viewport contract
        run: node tests/simultaneous-viewport-v012.test.js
      - name: Reflection foundations contract
        run: node tests/reflection-foundations-v013.test.js
      - name: R3 finite-ray physical invariants
        run: node tests/r3-finite-ray-v017.test.js
