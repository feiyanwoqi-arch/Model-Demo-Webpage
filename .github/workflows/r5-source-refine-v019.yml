name: Refine R5 v0.19 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r5-source-refine-v019.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch exact source and focused audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tests/visual-audit-r5-occlusion-v019.mjs')
          s=p.read_text()
          old="const t=(n.textContent||'').trim();return t&&(${visible.toString()})(n)&&parseFloat(getComputedStyle(n).fontSize)<floor;"
          new="const t=(n.textContent||'').trim(),s=getComputedStyle(n),r=n.getBoundingClientRect();return t&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)>0&&r.width>0&&r.height>0&&parseFloat(s.fontSize)<floor;"
          if old in s: s=s.replace(old,new)
          elif new not in s: raise SystemExit('focused audit syntax anchor missing')
          p.write_text(s)

          p=Path('assets/js/r5-workbench-v019.js')
          s=p.read_text()
          replacements={
            "a.text('教学近似：耦合尺度 ∝ e⁻²ᵏᵍ',686,27,C.orangeDark,14,'right',800);":"a.text('教学近似：耦合尺度 ∝ e⁻²ᵏᵍ',686,27,C.orangeDark,16,'right',800);",
            "a.text(`第一棱镜 n₁=${s.n1.toFixed(2)}`,86,y2+29,C.ink,14,'left',800);":"a.text(`第一棱镜 n₁=${s.n1.toFixed(2)}`,86,y2+29,C.ink,16,'left',800);",
            "a.text(`第二耦合介质 n₃=${s.n3.toFixed(2)}`,86,y1-gapPx+29,C.ink,14,'left',800);":"a.text(`第二耦合介质 n₃=${s.n3.toFixed(2)}`,86,y1-gapPx+29,C.ink,16,'left',800);",
            "a.text(`间隙 g=${Math.round(s.gap)} nm`,360,146,C.purple,14,'center',800);":"a.text(`间隙 g=${Math.round(s.gap)} nm`,360,146,C.purple,16,'center',800);",
            "a.text(o.tir?'近似耦合强度':'需先进入全反射区',563,220,o.tir?C.purple:C.orangeDark,14,'center',800);":"a.text(o.tir?'近似耦合强度':'需先进入全反射区',563,220,o.tir?C.purple:C.orangeDark,16,'center',800);"
          }
          for old,new in replacements.items():
            if old in s: s=s.replace(old,new)
            elif new not in s: raise SystemExit('apparatus label anchor missing: '+old[:56])
          p.write_text(s)
          PY
          node --check assets/js/r5-workbench-v019.js
          node --check tests/visual-audit-r5-occlusion-v019.mjs
          node tests/r5-physics-v019.test.js
          node tests/r5-physics-extended-v019.test.js
      - name: Commit directly to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/r5-source-refine-v019.yml
          git add -A
          git commit -m "Refine R5 apparatus labels and focused acceptance audit"
          git push
